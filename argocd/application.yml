apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: s12ike-argocd
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ikeali/s12ike-argocd.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
